name: homelink
description: A decentralized, offline home communication app using Wi-Fi Direct.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # --- State Management ---
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # --- P2P Connectivity ---
  flutter_p2p_connection: ^3.0.3

  # --- Local Database (Drift / SQLite) ---
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28

  # --- Voice Calling ---
  flutter_webrtc: ^0.12.4

  # --- Encryption ---
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.4

  # --- Utilities ---
  uuid: ^4.5.1
  path_provider: ^2.1.5
  shared_preferences: ^2.3.4
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  intl: ^0.19.0
  path: ^1.9.1

  # --- QR Code ---
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # --- Serialization ---
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.6

  # --- UI ---
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # --- Code Generation ---
  build_runner: ^2.4.14
  drift_dev: ^2.22.1
  riverpod_generator: ^2.6.3
  json_serializable: ^6.9.2
  freezed: ^2.5.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/
